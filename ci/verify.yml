name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Exact policy and oracle checks
        run: python verification/verify_refreshing.py --report artifacts/verification.json
      - name: Clipped-cost cap checks
        run: python verification/check_clipped_cap.py --report artifacts/clipped_cap.json
      - name: Prefix-transfer checks
        run: python verification/check_prefix_transfer.py --report artifacts/prefix_transfer.json
      - name: Fixed-resolution checks
        run: python verification/check_fixed_resolution.py --report artifacts/fixed_resolution.json
